kind = "web"
previewPath = "/"
title = "InterVent"
version = "1.0.0"
id = "artifacts/intervent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23709

[services.development]
run = "pnpm --filter @workspace/intervent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/intervent", "run", "build" ]
publicDir = "artifacts/intervent/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23709"
BASE_PATH = "/"
