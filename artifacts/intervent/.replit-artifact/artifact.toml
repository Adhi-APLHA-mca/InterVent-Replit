kind = "web"
previewPath = "/"
title = "InterVent"
version = "1.0.0"
id = "artifacts/intervent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/intervent && node node_modules/vite/bin/vite.js --host 0.0.0.0 --port $PORT'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/intervent", "run", "build" ]
publicDir = "artifacts/intervent/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/"
